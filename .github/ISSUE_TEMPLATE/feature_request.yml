name: ✨ Feature request
description: Suggest an idea for Onyx
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case. Why do you need it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: Describe the feature you have in mind.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS and Linux
        - macOS only
        - Linux only
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, examples from other launchers, links.
